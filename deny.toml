# cargo-deny policy. `cargo deny check` covers licences, advisories, duplicate versions
# and unexpected sources; `node scripts/check-licenses.mjs` covers the licence half with
# nothing installed beyond the toolchain the repo already needs. CI runs the script; a
# maintainer with cargo-deny installed gets the rest.
#
#   cargo install cargo-deny --locked
#   cargo deny check

[graph]
# Windows ships first, but nazar-core is built and tested on all three, and the macOS
# build is a roadmap item. Checking every target now means the licence question is
# already answered when that build arrives.
#
# `targets` is deliberately left unset, which means every target rather than three. That is
# wider than `scripts/third-party-notices.mjs`, which names x86_64-pc-windows-msvc,
# x86_64-unknown-linux-gnu and aarch64-apple-darwin — and the difference is on purpose:
# the notices are an attribution for the binaries that ship, so they list what those three
# actually contain, while this file is a gate on what may enter the lock file at all and has
# no reason to stop looking at a target nobody builds yet. Narrowing it would be a rule that
# only notices a copyleft crate once somebody adds a platform to the release.
all-features = false

[licenses]
version = 2
# Permissive only. Copyleft in an MIT product is a rewrite, not a paperwork problem
# (unified plan, risk R6).
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # Mozilla's root certificate list (data, not code) via webpki-root-certs and
    # webpki-roots. No share-alike clause. The first reaches us through reqwest, which
    # tauri itself depends on; the second through ureq, the HTTP client of the opt-in
    # detailed-windows mode.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
exceptions = []
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Nothing here yet. A crate that reads credentials or opens a socket without the product
# asking it to belongs in this list with the reason written beside it.
deny = []

[advisories]
version = 2
yanked = "deny"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
