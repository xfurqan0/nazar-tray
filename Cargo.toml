[workspace]
members = ["crates/nazar-core", "crates/nazar-statusline", "crates/nazar-tray"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
# 1.85 is what edition 2024 needs. The extra two releases are `ruzstd`'s own declared
# minimum (T-WP26), written down here rather than left for somebody on an older toolchain
# to discover; nothing in this workspace's own sources needs anything newer than 1.85.
rust-version = "1.87"
license = "MIT"
authors = ["Furkan Yıldız <xfurqan0@users.noreply.github.com>"]
repository = "https://github.com/xfurqan0/nazar-tray"
homepage = "https://github.com/xfurqan0/nazar-tray"
description = "The system-tray face of Nazar: Claude Code and Codex quota windows, read from local files."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
