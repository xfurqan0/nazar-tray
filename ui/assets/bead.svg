<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges" role="img" aria-label="Nazar bead">
  <title>Nazar bead</title>
  <!--
    The mark, on the 16x16 grid the tray actually draws at. Every cell is a whole unit, so
    at 16 px each rect lands on exactly one device pixel and nothing is resampled; blown up
    it stays 8-bit art rather than becoming a blur of it.

    Geometry identical to Nazar's docs/design/icon-04-pixel-bead.svg, cell for cell. Rim
    #0E2A5A, band #FFFFFF and pupil #0A0A0F are the brand definition shared with Nazar and
    must not drift. The iris is the one difference: #F2A93B here against Nazar's #3FA9F5,
    so that the two beads sitting side by side in one Windows tray are told apart at 16 px,
    where a difference of shape would not survive. #F2A93B is itself Nazar's amber — the
    colour its bar bead turns past the warning threshold, modes.dark.warn in the shared
    theme — so the two marks differ by a hex the family already owns.

    Three things read this file and two tests compare them: scripts/render-bead-png.mjs
    rasterises it for the application icons, ui/build.mjs inlines it into the panel, and
    crates/nazar-tray/src/icon.rs carries the same grid as sixteen strings.
    ui/test/theme.test.mjs pins the hexes; the Rust tests pin the geometry.
  -->
  <rect x="6" y="0" width="4" height="1" fill="#0E2A5A"/>
  <rect x="4" y="1" width="8" height="1" fill="#0E2A5A"/>
  <rect x="2" y="2" width="4" height="1" fill="#0E2A5A"/>
