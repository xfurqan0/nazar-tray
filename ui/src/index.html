<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nazar-tray</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      Every visible string is empty here and filled by main.ts from the locale files.
      An English word typed into this file would be a string that no translation can
      reach, which is the failure mode docs/PROJECT.md WP6 exists to prevent.

      The structure is fixed and the provider cards are built at run time: a card drawn
      before the first `get_snapshot` would be a card asserting something nobody has read.
    -->
    <main class="panel" data-panel>
      <header class="head">
        <span class="mark" data-bead><!--BEAD_SVG--></span>
        <h1 class="title" data-i18n="app.name"></h1>
        <span class="version" data-version></span>
        <span class="pill pill-demo" data-demo hidden data-i18n="panel.demo"></span>
      </header>

      <!--
        Two views in one window. The quota view is what a click on the bead opens; the
        settings view is what the tray menu's `Settings` asks for. One window rather than
        two, because a second window would need its own placement, its own blur rules and
        its own capability entry — and the panel already measures itself and asks Rust for
        a height that fits whichever view is showing.
      -->
      <div class="view" data-view="quota">
        <!-- Shown once, on the first run, and dismissed for good. -->
        <section class="hint" data-hint hidden>
          <p class="hint-text" data-i18n="panel.hint.overflow"></p>
          <button type="button" class="button" data-dismiss data-i18n="panel.hint.dismiss"></button>
        </section>

        <!-- The one-time Max-plan offer. WP2b decided it; this is where it is made. -->
        <section class="hint suggestion" data-suggestion hidden>
          <p class="hint-text" data-i18n="settings.detailed.suggestion"></p>
          <span class="suggestion-actions">
            <button
              type="button"
              class="button"
              data-suggestion-accept
              data-i18n="settings.detailed.suggestion.turnOn"
            ></button>
            <button
              type="button"
              class="button"
              data-suggestion-dismiss
              data-i18n="settings.detailed.suggestion.dismiss"
            ></button>
          </span>
        </section>

        <ul class="providers" data-providers></ul>

        <p class="empty" data-empty hidden data-i18n="panel.status.noData"></p>

        <footer class="foot">
          <button type="button" class="button" data-refresh data-i18n="panel.action.refresh"></button>
          <button type="button" class="button" data-open-usage data-i18n="usage.title"></button>
          <button type="button" class="button" data-open-settings data-i18n="settings.title"></button>
          <span class="esc" data-i18n="panel.hint.close"></span>
        </footer>
      </div>

      <!--
        The third view: what the tokens went on. It sits in the same window as the other two
        for the same reason, and it is the only view whose command reads more than two small
        files — so it has a loading line of its own, and what it draws comes from a store
        rather than from this second's reading.

        The rows, the strip and the footer lines are built at run time: a row drawn before
        `get_usage` answered would be a row asserting a number nobody has counted.
      -->
      <div class="view usage" data-view="usage" hidden>
        <div class="settings-head">
          <button type="button" class="button" data-usage-back data-i18n="settings.back"></button>
          <h2 class="settings-title" data-i18n="usage.title"></h2>
        </div>

        <!--
          Four tabs, and the fourth is not a fourth window. *Week* is this Monday to now;
          *Weeks*, *All* and *Models* are three readings of the same widest window, so moving
          between them costs no request — see `needsFetch` in `usage.ts`. *Month* left with
          T-WP21: the calendar on *All* draws the month being lived in and eleven more.
        -->
        <div class="usage-tabs" data-usage-tabs role="tablist">
          <button
            type="button"
            class="button usage-tab"
            role="tab"
            data-usage-tab="week"
            data-i18n="usage.range.week"
          ></button>
          <button
            type="button"
            class="button usage-tab"
            role="tab"
            data-usage-tab="weeks"
            data-i18n="usage.range.weeks"
          ></button>
          <button
            type="button"
            class="button usage-tab"
            role="tab"
            data-usage-tab="all"
            data-i18n="usage.range.all"
          ></button>
          <button
            type="button"
            class="button usage-tab"
            role="tab"
            data-usage-tab="models"
            data-i18n="usage.range.models"
          ></button>
        </div>

        <!--
          What a day or a week says when it is opened, and the way back to the list it was
          opened from. It stands where the tabs stand, because a detail is not a fifth tab and
          a row of tabs above it would offer four ways out of a page with one way back.
        -->
        <div class="usage-scope" data-usage-scope hidden>
          <button
            type="button"
            class="button"
            data-usage-scope-back
            data-i18n="settings.back"
          ></button>
          <span class="usage-scope-title" data-usage-scope-title></span>
        </div>

        <p class="note note-error" data-usage-error hidden></p>
        <pre class="console" data-usage-detail hidden></pre>
        <p class="empty" data-usage-state hidden></p>

        <!--
          The headline, the four counters it is made of, and the line that says how far the
          history goes and how old it is. All three are one block on purpose: the number is
          only worth reading next to what it is a sum of and when it was last counted.
        -->
        <section class="usage-summary" data-usage-summary hidden>
          <p class="usage-headline">
            <span class="usage-total" data-usage-total></span>
            <span class="usage-caption" data-i18n="usage.tokens"></span>
            <!--
              Only ever shown when the headline is not this product's own answer: the per-line
              count `/usage` prints, or a day another program reported. The deduplicated spend
              carries no tag, because a label on the default makes the default look unusual.
            -->
            <span class="usage-tag" data-usage-tag hidden></span>
          </p>
          <p class="usage-parts" data-usage-parts></p>
          <p class="usage-info" data-usage-info hidden></p>
        </section>

        <!--
          Two drawings of the same days, one per tab. *Week* keeps the strip of seven columns;
          *All* draws the calendar, weeks as columns and Monday at the top. Both are built at
          run time, both feed the one hover line underneath — which is the panel's own and not
          the operating system's tooltip — and in both of them a day can be opened.
        -->
        <div class="usage-strip" data-usage-strip hidden></div>

        <div class="usage-grid" data-usage-grid hidden>
          <div class="usage-plot">
            <div class="usage-months" data-usage-months></div>
            <div class="usage-weeks" data-usage-weeks></div>
          </div>
        </div>

        <div class="usage-scale" data-usage-scale hidden>
          <p class="usage-hover" data-usage-hover></p>
          <span class="usage-legend">
            <span data-i18n="usage.less"></span>
            <span class="usage-legend-keys" data-usage-legend aria-hidden="true"></span>
            <span data-i18n="usage.more"></span>
          </span>
        </div>

        <!--
          *Weeks*: one row per calendar week, newest first, each of them a way into that week.
          Dense, for the reason the heat-map is dense — a quiet week is a fact, and a list that
          closed the gap would put a fortnight's neighbours next to each other.
        -->
        <ul class="usage-week-rows" data-usage-week-rows hidden></ul>

        <!--
          *Models*: a span selector, a line per model over the days in it, a legend that names
          every line, and then the same model rows as the other tabs with a share beside them.
          The chart is hand-written SVG built at run time — still no charting library, which is
          decision K2 — and its colours come from `seriesPalette` in `theme.ts`.
        -->
        <section class="usage-models" data-usage-models hidden>
          <div class="usage-spans" data-usage-spans role="tablist">
            <button
              type="button"
              class="button usage-span"
              role="tab"
              data-usage-span="all"
              data-i18n="usage.range.all"
            ></button>
            <button
              type="button"
              class="button usage-span"
              role="tab"
              data-usage-span="days7"
              data-i18n="usage.span.days7"
            ></button>
            <button
              type="button"
              class="button usage-span"
              role="tab"
              data-usage-span="days30"
              data-i18n="usage.span.days30"
            ></button>
          </div>
          <p class="usage-caption" data-i18n="usage.chart.daily"></p>
          <div class="usage-chart" data-usage-chart></div>
          <ul class="usage-keys" data-usage-keys></ul>
        </section>

        <ul class="usage-rows" data-usage-rows></ul>

        <p class="note" data-usage-damaged hidden></p>

        <footer class="foot">
          <button
            type="button"
            class="button"
            data-usage-refresh
            data-i18n="panel.action.refresh"
          ></button>
          <span class="esc" data-i18n="panel.hint.close"></span>
        </footer>
      </div>

      <form class="view settings" data-view="settings" data-settings hidden>
        <div class="settings-head">
          <button type="button" class="button" data-settings-back data-i18n="settings.back"></button>
          <h2 class="settings-title" data-i18n="settings.title"></h2>
        </div>

        <p class="note" data-read-only hidden data-i18n="settings.readOnly"></p>
        <p class="note note-error" data-settings-errors hidden></p>

        <fieldset class="group">
          <legend data-i18n="settings.section.appearance"></legend>

          <label class="row">
            <span class="row-label" data-i18n="settings.language"></span>
            <select class="control" data-field="locale"></select>
          </label>

          <label class="row">
            <span class="row-label" data-i18n="settings.theme"></span>
            <select class="control" data-field="theme">
              <option value="nazar" data-i18n="settings.theme.nazar"></option>
              <option value="graphite" data-i18n="settings.theme.graphite"></option>
            </select>
          </label>

          <label class="row">
            <span class="row-label" data-i18n="settings.mode"></span>
            <select class="control" data-field="themeMode">
              <option value="system" data-i18n="settings.mode.system"></option>
              <option value="light" data-i18n="settings.mode.light"></option>
              <option value="dark" data-i18n="settings.mode.dark"></option>
            </select>
          </label>
        </fieldset>

        <fieldset class="group">
          <legend data-i18n="settings.section.providers"></legend>
          <label class="row check">
            <input type="checkbox" data-field="claude" />
            <span class="row-label" data-i18n="panel.provider.claude"></span>
          </label>
          <label class="row check">
            <input type="checkbox" data-field="codex" />
            <span class="row-label" data-i18n="panel.provider.codex"></span>
          </label>
          <p class="help" data-i18n="settings.providers.help"></p>
        </fieldset>

        <fieldset class="group">
          <legend data-i18n="settings.section.notifications"></legend>
          <label class="row check">
            <input type="checkbox" data-field="notifications" />
            <span class="row-label" data-i18n="settings.notifications.enable"></span>
          </label>

          <div class="row thresholds">
            <span class="row-label" data-i18n="settings.thresholds"></span>
            <span class="threshold">
              <input type="number" class="control number" data-field="warn" min="1" max="100" />
              <span class="unit" data-i18n="settings.thresholds.warn"></span>
            </span>
            <span class="threshold">
              <input type="number" class="control number" data-field="critical" min="1" max="100" />
              <span class="unit" data-i18n="settings.thresholds.critical"></span>
            </span>
            <span class="threshold">
              <input type="number" class="control number" data-field="exhausted" min="1" max="100" />
              <span class="unit" data-i18n="settings.thresholds.exhausted"></span>
            </span>
          </div>

          <label class="row check">
            <input type="checkbox" data-field="quietHoursEnabled" />
            <span class="row-label" data-i18n="settings.quietHours.enable"></span>
          </label>
          <div class="row times" data-quiet-times>
            <label class="time">
              <span class="unit" data-i18n="settings.quietHours.from"></span>
              <input type="time" class="control" data-field="quietFrom" />
            </label>
            <label class="time">
              <span class="unit" data-i18n="settings.quietHours.to"></span>
              <input type="time" class="control" data-field="quietTo" />
            </label>
          </div>
          <p class="help" data-i18n="settings.quietHours.help"></p>
          <p class="help" data-i18n="settings.notifications.help"></p>
        </fieldset>

        <fieldset class="group">
          <legend data-i18n="settings.section.startup"></legend>
          <label class="row check">
            <input type="checkbox" data-autostart />
            <span class="row-label" data-i18n="settings.autostart"></span>
          </label>
          <p class="help" data-i18n="settings.autostart.help"></p>
          <p
            class="help help-error"
            data-autostart-error
            hidden
            data-i18n="settings.autostart.unavailable"
          ></p>
        </fieldset>

        <!--
          The status-line wrapper. This is the only place in the product that offers to
          edit a file belonging to another program, which is why it asks twice: the first
          button runs `nazar-statusline install --dry-run` and prints the diff, and only the
          button that appears underneath it writes anything. The installer takes its own
          backup on top of that. Installing nazar-tray does none of this.
        -->
        <fieldset class="group">
          <legend data-i18n="settings.section.statusline"></legend>
          <p class="help" data-i18n="settings.statusline.help"></p>
          <p class="row statusline-state" data-statusline-state></p>
          <div class="row">
            <button type="button" class="button" data-statusline-preview></button>
            <button type="button" class="button primary" data-statusline-apply hidden></button>
            <button
              type="button"
              class="button"
              data-statusline-cancel
              hidden
              data-i18n="settings.statusline.cancel"
            ></button>
          </div>
          <p class="help" data-statusline-note hidden></p>
          <pre class="console" data-statusline-output hidden></pre>
        </fieldset>

        <fieldset class="group">
          <legend data-i18n="settings.section.usage"></legend>
          <label class="row check">
            <input type="checkbox" data-field="usageCountLikeClaudeCode" />
            <span class="row-label" data-i18n="settings.usage.perLine"></span>
          </label>
          <p class="help" data-i18n="settings.usage.perLine.help"></p>
          <label class="row check">
            <input type="checkbox" data-field="usageFillHistoryFromStats" />
            <span class="row-label" data-i18n="settings.usage.history"></span>
          </label>
          <p class="help" data-i18n="settings.usage.history.help"></p>
        </fieldset>

        <fieldset class="group">
          <legend data-i18n="settings.section.detailed"></legend>
          <label class="row check">
            <input type="checkbox" data-field="detailedWindows" />
            <span class="row-label" data-i18n="settings.detailed.enable"></span>
          </label>
          <p class="help" data-i18n="settings.detailed.help"></p>
        </fieldset>

        <fieldset class="group">
          <legend data-i18n="settings.section.files"></legend>
          <p class="path">
            <span data-i18n="settings.files.limits"></span><code data-path="limits"></code>
          </p>
          <p class="path">
            <span data-i18n="settings.files.captures"></span><code data-path="captures"></code>
          </p>
          <p class="path">
            <span data-i18n="settings.files.config"></span><code data-path="config"></code>
          </p>
          <p class="path">
            <span data-i18n="settings.files.alerts"></span><code data-path="alerts"></code>
          </p>
        </fieldset>

        <fieldset class="group">
          <legend data-i18n="settings.section.about"></legend>
          <div class="row">
            <button type="button" class="button" data-reset-hint data-i18n="settings.hint.reset"></button>
          </div>
          <p class="help" data-hint-reset-note hidden data-i18n="settings.hint.willShow"></p>
          <p class="about">
            <span data-i18n="app.name"></span>
            <span class="version" data-settings-version></span>
          </p>
          <!--
            Addresses as selectable text rather than links. The panel's content security
            policy is `default-src 'self'`, and opening a browser from a webview needs a
            plugin and a permission this application does not have; a link that navigated
            the panel to GitHub would replace the tray popup with a web page. So they are
            written down, and the user copies them.
          -->
          <p class="path">
            <span data-i18n="settings.link.repository"></span>
            <code data-link="repository"></code>
          </p>
          <p class="path">
            <span data-i18n="settings.link.contract"></span>
            <code data-link="contract"></code>
          </p>
        </fieldset>

        <footer class="foot settings-foot">
          <button type="submit" class="button primary" data-settings-save data-i18n="settings.save"></button>
          <span class="saved" data-saved hidden data-i18n="settings.saved"></span>
          <span class="esc" data-i18n="panel.hint.close"></span>
        </footer>
      </form>
    </main>
    <script type="module" src="panel.js"></script>
  </body>
</html>
