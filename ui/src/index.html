<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nazar-tray</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      Every visible string is empty here and filled by main.ts from the locale files.
      An English word typed into this file would be a string that no translation can
      reach, which is the failure mode docs/PROJECT.md WP6 exists to prevent.
    -->
    <main class="panel">
      <div class="bead" data-bead><!--BEAD_SVG--></div>
      <h1 class="headline" data-headline></h1>
      <ul class="providers">
        <li class="provider">
          <span class="provider-name" data-i18n="panel.provider.claude"></span>
          <span class="provider-value" data-i18n="panel.window.unknown"></span>
        </li>
        <li class="provider">
          <span class="provider-name" data-i18n="panel.provider.codex"></span>
          <span class="provider-value" data-i18n="panel.window.unknown"></span>
        </li>
      </ul>
      <p class="hint" data-i18n="panel.hint.close"></p>
    </main>
    <script type="module" src="panel.js"></script>
  </body>
</html>
