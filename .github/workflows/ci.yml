name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate. Everything that decides whether a change is correct lives here, and none
  # of it needs the bundler. Risk R1 in the unified plan: the Tauri bundler is the
  # fragile part of a Windows pipeline (WebView2, NSIS, code signing), and a bundler
  # problem must never be able to make a correct change look broken.
  windows:
    name: Windows — lint, test, build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install panel dependencies
        working-directory: ui
        run: npm ci

      # tauri::generate_context! reads frontendDist at compile time, so the panel
      # must be built before clippy or cargo test can even expand the macro.
      - name: Build the panel
        working-directory: ui
        run: npm run build

      # `bundle.externalBin` names the status-line wrapper, and `tauri-build` checks that
      # the file is there while the tray crate compiles — so the sidecar has to exist before
      # clippy and cargo test, not only before the bundler. A debug build of it is enough to
      # satisfy the check and is seconds rather than minutes.
      - name: Prepare the status-line sidecar
        run: node scripts/sidecar.mjs --debug

      - name: Check dependency licences
        run: node scripts/check-licenses.mjs

      # THIRD-PARTY-NOTICES.md ships inside the installer, so a dependency added without
      # regenerating it would put a release on the internet whose attribution is a version
      # behind. Cheap to check, impossible to remember.
      - name: Check the third-party notices are current
        run: node scripts/third-party-notices.mjs --check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Type-check the panel
        working-directory: ui
        run: npm run typecheck

      # Builds ui/dist as a side effect, which the Rust build needs for frontendDist.
      - name: Test the panel
        working-directory: ui
        run: npm test

      - name: Test the workspace
        run: cargo test --workspace

      # The opt-in detailed-windows mode is the only part of this product that reads a
      # token or opens a socket, and it sits behind a cargo feature as well as a runtime
      # flag. This run is the proof that the switch is real: with the feature off the
      # module is not compiled, no HTTP client is linked, and everything else still passes.
      # It is also the shape `nazar-statusline` is released in.
      - name: Test nazar-core with the opt-in mode compiled out
        run: cargo test -p nazar-core --no-default-features

  # The same gate, on the operating system the tray had never been compiled for. Until this
  # job existed the Linux half of the promise in `docs/PROJECT.md` section 2 — "Windows
  # release first; macOS and Linux builds later from the same code", whose opposite is "a
  # Windows-only codebase" — was checked by two library crates with no Tauri in them, and the
  # tray itself could have stopped building on Linux months before anybody looked.
  #
  # It is a near-copy of the Windows job rather than a matrix leg of it, for the same reason
  # `bundle` is its own job: the steps differ. Linux needs the GTK and WebKitGTK development
  # packages before cargo can link anything, and `third-party-notices.mjs --check` cannot
  # pass here — the notices file is resolved for one host triple, and Linux pulls in the
  # gtk/webkit/dbus half of the tree that Windows never sees. Making that file tell the truth
  # on both platforms is T-WP-L5; until then the check stays where it is generated, and the
  # Linux job would only be red about a file it is not allowed to rewrite.
  #
  # `cargo fmt` and `check-licenses.mjs` read the source and the lock file, so they say the
  # same thing on every operating system and are not worth a second runner. Clippy is the
  # opposite: `#[cfg(unix)]` code is invisible to the Windows job, and a lint against it
  # would have been found by a user rather than by CI.
  #
  # ubuntu-22.04 and not ubuntu-latest: glibc 2.35 against 24.04's 2.39. What this job
  # compiles is what T-WP-L6 will eventually package, and a binary linked against the newer
  # glibc does not start on Debian 12.
  linux:
    name: Linux — lint, test, build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # WebKitGTK and GTK3 are what tao, wry and tray-icon link against on Linux; dbus is
      # what the notification plugin talks to; librsvg renders the icon the bundler installs;
      # patchelf is the Tauri bundler's. `libayatana-appindicator3-dev` is the one that looks
      # optional and is not: without it the tray icon has no library to dlopen at run time,
      # and the application would build here and show nothing on a user's desktop.
      - name: Install the GTK stack
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf

      - name: Install panel dependencies
        working-directory: ui
        run: npm ci

      # tauri::generate_context! reads frontendDist at compile time, so the panel must be
      # built before clippy or cargo test can even expand the macro.
      - name: Build the panel
        working-directory: ui
        run: npm run build

      # `bundle.externalBin` names the status-line wrapper and `tauri-build` checks it is on
      # disk under its target-triple name while the tray crate compiles — which on this
      # runner is `nazar-statusline-x86_64-unknown-linux-gnu`, produced by the same script
      # that produces the `.exe` on Windows.
      - name: Prepare the status-line sidecar
        run: node scripts/sidecar.mjs --debug

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test the workspace
        run: cargo test --workspace

  # nazar-core and nazar-statusline are pure Rust with no Tauri in them, so they compile
  # and test everywhere. The tray app itself is Windows-only in v1 on purpose: no toolkit
  # gives a reliable tray popup on Linux (even CodexBar closed its Linux tray issue as not
  # planned), and the macOS build waits for a signing certificate. Keeping these two green
  # on all three systems is what makes those later builds a step rather than a rewrite, so
  # it is checked from the first commit instead of the first port. It also exercises the
  # wrapper's POSIX path — `sh -c` for the chained command — which the Windows job never
  # reaches.
  core:
    name: Core and wrapper — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: core-${{ matrix.os }}

      - name: Test nazar-core and nazar-statusline
        run: cargo test -p nazar-core -p nazar-statusline

  # A gate since WP7. It was `continue-on-error` while the installer was a by-product of the
  # build (WP0's note, risk R1: a bundler problem must not make a correct change look
  # broken). The installer is now the product — it is what `winget install` fetches — so a
  # bundler failure is a broken release rather than a broken convenience, and it turns the
  # run red like everything else.
  bundle:
    name: Windows — installer
    runs-on: windows-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install panel dependencies
        working-directory: ui
        run: npm ci

      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      # Panel, notices, sidecar, bundler — one script, because the order between them
      # matters and three of the four are easy to forget. `--debug` keeps a pull request's
      # feedback in minutes; the release workflow runs the same script without it.
      # The NSIS toolchain is downloaded by the Tauri bundler on first use.
      - name: Build the installer
        run: node scripts/build-installer.mjs --debug

      # The build script has already run this and would have deleted the bundle if it had
      # failed. It is a step of its own anyway, for two reasons: a red cross against a named
      # step says *what* broke without anybody opening the log, and the check outlives any
      # future change to the line above it. This is also the only job that proves the remap
      # works on a machine that is not the maintainer's — the runner's own
      # `C:\Users\runneradmin` is held to exactly the same rule, on every pull request,
      # rather than the rule being discovered broken on release day.
      - name: Check the binaries for build-machine paths
        run: node scripts/check-binary-paths.mjs --profile debug

      - uses: actions/upload-artifact@v4
        with:
          name: nazar-tray-debug-windows
          path: |
            target/debug/nazar-tray.exe
            target/debug/nazar-statusline.exe
            target/debug/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
