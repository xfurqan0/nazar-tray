[package]
name = "nazar-tray"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "System-tray app showing Claude Code and Codex quota windows."

[lints.rust]
missing_docs = "warn"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nazar-core = { path = "../nazar-core" }
serde.workspace = true
serde_json.workspace = true

# `tray-icon` is what turns on the tray in Tauri v2; `image-png` lets the tray take the
# bead PNG. Both are Tauri's own features, not extra crates.
tauri = { version = "2", features = ["tray-icon", "image-png"] }

# WP0 declares these so the versions are resolved and the licence audit sees them.
# None of them is initialised yet; each is wired by the work package named beside it.
tauri-plugin-notification = "2" # WP5: threshold toasts at 60 / 85 / 100 %
tauri-plugin-autostart = "2"    # WP5: "start with Windows" toggle
tauri-plugin-updater = "2"      # WP7: signed updates from GitHub Releases

# T-WP-L1: `localtime_r`, `tzset` and the layout of `struct tm`, for the quiet hours the
# tray could not read on Linux. Not a new dependency in any sense that costs anything --
# libc is already in Cargo.lock and already compiled for this target, several crates deep
# in the Tauri tree, and it is in THIRD-PARTY-NOTICES.md either way. What it buys is the
# one thing hand-written FFI cannot: `struct tm` has two trailing fields that are a glibc
# and BSD extension, and a declaration that gets them wrong is a function writing past the
# end of a stack local rather than a compile error.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# T-WP-L2: one D-Bus question at start-up -- is there a StatusNotifierItem host on the
# session bus? -- because a Linux tray icon handed to a desktop without one is registered,
# accepted and drawn nowhere. Not a new dependency: `tauri-plugin-notification` already
# pulls zbus in on Linux through `notify-rust`, at this same version, so the lock file does
# not move and nothing extra is compiled. What is new is `blocking-api`, which is the API
# that answers a question on the thread that asked it -- this one is asked once, before the
# event loop exists, and the async form would need a runtime this process does not have.
# `default-features = false` names the rest explicitly rather than inheriting whatever a
# future default adds.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
