[package]
name = "nazar-statusline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Records Claude Code's status-line payload and runs the status line you already had."
# A binary with a path dependency, which crates.io cannot take: the registry rejects
# `{ path = ... }` without a version, and pinning one here would be a second version
# number to bump at every release. Saying so is also what lets `allow-wildcard-paths`
# in deny.toml apply — cargo-deny only forgives a wildcard path dependency in a crate
# that is not published.
publish = false

[lints.rust]
missing_docs = "warn"

[lib]
name = "nazar_statusline"
path = "src/lib.rs"

[[bin]]
name = "nazar-statusline"
path = "src/main.rs"

# Deliberately three dependencies and no Tauri: this binary runs on every status-line
# refresh, so every millisecond of start-up is a millisecond of the user's prompt.
#
# `default-features = false` drops nazar-core's `detailed-windows` feature, so the wrapper
# asks for neither an HTTP client nor the module that reads a token. Built on its own —
# which is how it is released — none of that is compiled at all.
[dependencies]
nazar-core = { path = "../nazar-core", default-features = false }
serde.workspace = true
serde_json.workspace = true
